<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Margin</title>
    <meta name="description" content="Margin turns a month of sales, payroll, bank and ad exports into one clear page: money in, money out, what's left, what's paying off, and the one leak to fix. Files never leave your device.">
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Margin">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app" class="app" aria-live="polite"></div>

    <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
        <div class="sheet-inner" id="sheet-body"></div>
    </dialog>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="engine.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
</body>
</html>
